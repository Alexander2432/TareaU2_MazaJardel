# Contenedores del proyecto espe-expressjs para la Unidad 2.
# PostgreSQL + pgAdmin (Unidad 1) y MongoDB (Unidad 2).
# MongoDB Compass se instala en la PC y se conecta al contenedor "mongo".
#
#   docker compose up -d            # levanta todo
#   docker compose up -d mongo      # solo MongoDB
#   docker compose down             # detiene (los datos quedan en los volúmenes)

name: espe-expressjs-main

services:
  postgres:
    image: postgres:17-alpine
    container_name: espe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-espe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-espe_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-espe_user} -d ${POSTGRES_DB:-espe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: espe-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Configura PGADMIN_PASSWORD en .env}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: espe-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-espe_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Configura MONGO_PASSWORD en .env}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data:
